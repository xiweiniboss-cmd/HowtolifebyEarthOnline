<script>
/* 题目表。sec + key 按「第几节、标题里含哪段字」找条目，不写条号，插条目顺延时不会指歪；
   找不到就在控制台报错并跳过这题。
   when(p) 按基本情况决定这题问不问；also 是没做到时顺带列出的相关条目。 */
const PROFILE = [
  {id:'ageYears', text:'你的周岁年龄', type:'number'},
  {id:'sex', text:'你的性别', opts:[['m','男'],['f','女']]},
  {id:'kid', text:'家里有 4 岁以下的孩子吗', opts:[['y','有'],['n','没有']]},
];
const validAge = age => age !== undefined && age !== null && String(age).trim() !== ''
  && Number.isInteger(Number(age)) && Number(age) >= 0 && Number(age) <= 120;
const ageAtLeast = (p, a) => validAge(p.ageYears) && Number(p.ageYears) >= a;
const GROUPS = [
  {name:'烟、酒和槟榔', mod:'身体', qs:[

    {sec:2, key:'少喝或不喝酒', text:'不喝酒，或者很少喝'},
    {sec:2, key:'不嚼槟榔', text:'不嚼槟榔'},
  ]},
  {name:'吃喝', mod:'身体', qs:[

    {sec:2, key:'全谷物', text:'主食里有一部分是糙米、燕麦、全麦这类全谷物'},
    {sec:2, key:'5 份', text:'每天吃够一斤左右的水果和蔬菜'},
    {sec:2, key:'坚果', text:'每天吃一小把坚果'},
    {sec:2, key:'低钠盐', text:'家里做饭用低钠盐', hint:'有肾功能不全或正在吃保钾类药物的，换盐前先问医生；不适用可以跳过'},
    {sec:2, key:'滚烫', text:'热茶热汤放一放再喝，不喝滚烫的'},

    {sec:2, key:'力量训练', text:'每周做点力量训练（俯卧撑、深蹲、器械都算）'},
    {sec:2, key:'别连着坐太久', text:'不会连着坐好几个小时不起身'},
    {sec:2, key:'每晚睡 7', text:'每晚睡 7 小时左右，作息基本固定'},
    {sec:2, key:'晒晒太阳', text:'白天会出门见见太阳，不是整天待在屋里'},
    {sec:2, key:'BMI', text:'体重在正常范围（BMI 20–25）', hint:'BMI = 体重(公斤) ÷ 身高(米)²'},
    {sec:2, key:'认真刷牙', text:'每天认真刷牙、清一次牙缝，缺了牙会去补'},
    {sec:1, key:'平衡和腿部力量', text:'练过平衡和腿部力量，浴室楼梯装了扶手防滑', when:p => ageAtLeast(p,60)},

    {sec:1, key:'烟雾报警器', text:'家里装了烟雾报警器'},

    {sec:1, key:'野生蘑菇', text:'不采、不买、不吃野生蘑菇'},

  {name:'急救常识', mod:'急救常识', qs:[
    {sec:13, key:'叫不应、没正常呼吸', text:'看到有人倒地、叫不应、没正常呼吸，知道要立刻用力按压胸口，并让旁人找 AED'},
    {sec:13, key:'突然嘴歪', text:'知道突然嘴歪、一侧胳膊没劲要直接打 120，不自己开车去'},
    {sec:13, key:'胸口压着疼', text:'知道胸口压着疼超过 15 分钟不缓解要打 120'},
    {sec:13, key:'有人噎住', text:'会给噎住的人做拍背加腹部冲击'},

    {sec:13, key:'误服', text:'知道误服清洁剂、农药不催吐，带上瓶子去医院'},
    {sec:13, key:'火灾时', text:'知道火灾时贴地走、先摸门、走楼梯不坐电梯'},
    {sec:13, key:'婴儿噎住', text:'会给不满 1 岁的婴儿做拍背加按胸', when:p => p.kid === 'y'},
  ]},
  {name:'精力和情绪', mod:'精力', qs:[
    {sec:3, key:'关掉非必要通知', text:'关掉了手机上不必要的通知，工作时手机放在看不到的地方'},
    {sec:3, key:'固定起床时间', text:'周末也基本按平时的时间起床'},
    {sec:3, key:'下午两点以后', text:'下午两点以后不喝咖啡、浓茶'},
    {sec:3, key:'到点就睡', text:'不会为了打游戏、刷短视频熬夜'},
    {sec:3, key:'睡前一小时', text:'睡前一小时不看手机'},
    {sec:3, key:'别人过得怎么样', text:'不会每天刷同龄人的动态'},
    {sec:3, key:'49 小时', text:'每周工作时间基本不超过 50 小时', hint:'没在上班可以跳过'},
    {sec:3, key:'学会拒绝', text:'不想接的请求能说出「不」'},
    {sec:22, key:'定期和人见面', text:'定期和朋友家人见面，不是心情差了才找人'},
  ]},
  {name:'钱', mod:'钱', qs:[
    {sec:5, key:'自动续费', text:'关掉了不用的自动续费'},
    {sec:5, key:'个税汇算', text:'每年做个税汇算，该填的专项附加扣除都填了', hint:'没有工资收入可以跳过'},
    {sec:5, key:'最低还款', text:'不用信用卡最低还款，不开消费分期和消费贷'},
    {sec:5, key:'先存出', text:'存了 3 到 6 个月生活费的应急金，能随时取'},
    {sec:5, key:'高收益', text:'看到「保本」「高收益」「稳赚」会直接走开'},
    {sec:5, key:'家庭共济', text:'在医保 App 上办了家庭共济', hint:'没有职工医保可以跳过'},
    {sec:5, key:'三者险', text:'开车的话，三者险买够了', hint:'没有车可以跳过'},
    {sec:5, key:'定期寿险', text:'家里有人靠你的收入过日子，你买了定期寿险', hint:'家里没人靠你收入可以跳过'},
    {sec:5, key:'宽基指数', text:'长期投资的钱放在宽基指数基金，而不是主动基金或个股', hint:'没有投资可以跳过'},
  ]},
  {name:'账号与防骗', mod:'账号与防骗', qs:[
    {sec:14, key:'二次验证', text:'邮箱、支付、社交账号都开了二次验证'},
    {sec:14, key:'邮箱密码单独', text:'邮箱密码单独一个，没在别的网站用过'},
    {sec:14, key:'锁屏密码', text:'手机设了锁屏密码，SIM 卡设了 PIN 码'},
    {sec:8, key:'通讯录里的旧号码', text:'家人视频或电话要你转账，会先挂断，用通讯录里的旧号码打回去核实'},
    {sec:8, key:'不把银行卡', text:'从不把银行卡、手机卡、支付账号借给别人'},
    {sec:8, key:'征信报告', text:'查过自己的征信报告'},
    {sec:8, key:'签字前', text:'签字前会把纸看完，不在空白纸上签'},
  ]},
];
const MODS = ['身体', '急救常识', '精力', '钱', '账号与防骗'];
const modOn = m => ans['mod:' + m] !== 'off';

/* 解析：和 index.html 的 parseReadme 同一套格式，只取这里用得到的字段 */
const COST_W = { money:{'0':0,'少':1,'多':2}, time:{'少':0,'中':1,'多':2}, will:{'否':0,'些':1,'是':2} };
function parse(md){
  const out = []; let sec = null, e = null; let m;
  for (const raw of md.split(/\r?\n/)){
    const line = raw.trimEnd();
    if ((m = /^#{1,2} (\d+)\. /.exec(line))) { sec = +m[1]; e = null; continue; }
    if ((m = /^### (\d+)\. (.+)$/.exec(line)) && sec) { e = {sec, n:+m[1], title:m[2].trim(), human:'', cost:'', grade:'', note:''}; out.push(e); continue; }
    if (!e) continue;
    if ((m = /^\x3c!--\s*成本标签:\s*(.*?)\s*-->/.exec(line))){
      for (const kv of m[1].split(/\s+/)){ const [k,v] = kv.split('='); const p = {'钱':'money','时间':'time','毅力':'will','收益':'level','口径':'lens'}[k]; if (p) e[p] = v; }
    }
    else if ((m = /^- 说人话：(.*)$/.exec(line))) e.human = m[1];
    else if ((m = /^- 成本：(.*)$/.exec(line))) e.cost = m[1];
    else if ((m = /^- 证据等级：\s*([ABC])/.exec(line))) e.grade = m[1];
    else if ((m = /^- 备注：(.*)$/.exec(line))) e.note = m[1];
  }
  for (const x of out){
    x.cs = (COST_W.money[x.money] ?? 0) + (COST_W.time[x.time] ?? 0) + (COST_W.will[x.will] ?? 0);
    x.ratio = x.level === '大' ? (x.cs === 0 ? '极高' : (x.cs <= 2 ? '高' : '一般'))
            : x.level === '中' ? (x.cs === 0 ? '高' : '一般') : '一般';
    x.dispute = /^争议/.test(x.note);
  }
  return out;
}
const plain = s => s.replace(/\*\*/g, '').replace(/\\([*_])/g, '$1').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
const esc = s => s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

let ENTRIES = [];
const find = (sec, key) => {
  const hit = ENTRIES.find(x => x.sec === sec && x.title.includes(key));
  if (!hit) console.error(`自查题找不到条目：第 ${sec} 节，标题含「${key}」`);
  return hit;
};

/* 答案：只存本机浏览器，取不到也照常能用 */
const STORE = 'selfcheck-v1';
let ans = {};
try { ans = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(ans)); } catch (e) {} };
const profile = () => Object.fromEntries(PROFILE.map(p => [p.id, ans['p:'+p.id]]));
// 使用新字段 ageYears，旧版年龄段答案不会被当成实际年龄；其他答案保留。
const profileDone = () => PROFILE.every(p => p.type === 'number'
  ? validAge(ans['p:'+p.id]) : p.opts.some(([v]) => v === ans['p:'+p.id]));
const qid = q => q.sec + ':' + q.key + (q.rev ? ':v' + q.rev : '');
const shown = (q, p) => q.entry && modOn(q.g.mod) && (!q.when || (profileDone() && q.when(p)));
const activeQs = () => { const p = profile(); return GROUPS.flatMap(g => g.qs).filter(q => shown(q, p)); };

function seg(name, opts, cur, label){
  return `<div class="seg" role="group" aria-label="${esc(label)}">` + opts.map(([v, t, cls]) =>
    `<button type="button" data-k="${esc(name)}" data-v="${v}" class="${cls||''}" aria-pressed="${cur === v}">${t}</button>`).join('') + `</div>`;
}
const YN = [['y','做到了','yes'],['n','没做到','no'],['s','跳过']];

function renderAsk(updateProfile = true){
  const p = profile();
  let h = `<h2>基本情况<small>决定问哪些题</small></h2>`;
  for (const f of PROFILE) {
    const control = f.type === 'number'
      ? `<input class="profile-age" id="profile-age" type="number" inputmode="numeric" min="0" max="120" step="1" data-k="p:${f.id}" value="${esc(String(ans['p:'+f.id] ?? ''))}">`
      : seg('p:'+f.id, f.opts, ans['p:'+f.id], f.text);
    const label = f.type === 'number' ? `<label class="txt" for="profile-age">${f.text}</label>` : `<div class="txt">${f.text}</div>`;
    h += `<div class="q">${label}${control}</div>`;
  }
  h += `<div class="q"><div class="txt">想查哪几块<small>点一下取消，不查的整块不出题</small></div><div class="mods" role="group" aria-label="自查主题">`
    + MODS.map(m => `<button type="button" data-mod="${m}" aria-pressed="${modOn(m)}">${m}</button>`).join('') + `</div></div>`;
  if (updateProfile) document.getElementById('profile-qs').innerHTML = h;
  h = '';
  for (const g of GROUPS){
    const qs = g.qs.filter(q => shown(q, p));
    if (!qs.length) continue;
    h += `<h2>${g.name}</h2>`;
    for (const q of qs) h += `<div class="q"><div class="txt">${esc(q.text)}${q.hint ? `<small>${esc(q.hint)}</small>` : ''}</div>${seg(qid(q), YN, ans[qid(q)], q.text)}</div>`;
  }
  document.getElementById('topic-qs').innerHTML = h;
  const qs = activeQs(), n = qs.filter(q => ans[qid(q)]).length;
  document.getElementById('prog').textContent = profileDone() ? `已答 ${n} / ${qs.length} 题` : '先填基本情况';
}

const RANK = {'极高':0,'高':1,'一般':2}, LV = {'大':0,'中':1,'小':2}, GR = {A:0,B:1,C:2};
function card(e, also){
  const r = {'极高':'r3','高':'r2','一般':'r1'}[e.ratio];
  const lens = e.lens ? `<span class="badge plain">口径 ${e.lens}</span>` : '';
  const alsoH = also.length ? `<div class="also">相关做法：` + also.map(a =>
    `<a href="./#e-${a.sec}-${a.n}">${esc(plain(a.title))}</a>`).join('；') + `</div>` : '';
  return `<div class="card" id="c-${e.sec}-${e.n}">
    <div class="h"><b>${esc(plain(e.title))}</b><a href="./#e-${e.sec}-${e.n}">第 ${e.sec} 节第 ${e.n} 条</a></div>
    ${e.note ? `<details class="caution"><summary>适用条件与注意事项</summary>${esc(plain(e.note))}</details>` : ''}
    ${e.human ? `<div class="human">${esc(plain(e.human))}</div>` : ''}
    <div class="badges"><span class="badge ${r}">性价比 ${e.ratio}</span><span class="badge ${e.grade}">证据 ${e.grade} 级</span><span class="badge plain">收益 ${e.level}</span>${lens}${e.dispute ? '<span class="badge warn">有争议</span>' : ''}</div>
    <div class="cost">要花的：${esc(plain(e.cost))}</div>${alsoH}
  </div>`;
}
/* 没做到的事按「要不要改习惯」分三堆：成本标签里的毅力一项直接决定 */
const PILES = [
  {will:'否', name:'一次办完就行', sub:'做一次或者记住就够，不用改习惯'},
  {will:'些', name:'要改一个习惯', sub:'要忍一点不适，坚持几周就成了习惯'},
  {will:'是', name:'要长期坚持', sub:'和惯性长期对着干，最难，挑一件慢慢来'},
];
const WILL = {'否':0,'些':1,'是':2};
const byValue = (a, b) => RANK[a.entry.ratio] - RANK[b.entry.ratio] || LV[a.entry.level] - LV[b.entry.level]
  || WILL[a.entry.will] - WILL[b.entry.will] || GR[a.entry.grade] - GR[b.entry.grade] || a.entry.cs - b.entry.cs;
function renderOut(){
  const qs = activeQs();
  const no = qs.filter(q => ans[qid(q)] === 'n').sort(byValue), yes = qs.filter(q => ans[qid(q)] === 'y');
  const answered = no.length + yes.length;

  // 各块做到的比例，只算答了「做到 / 没做到」的题，跳过的不进分母
  const groups = GROUPS.map(g => {
    const y = yes.filter(q => q.g === g).length, n = no.filter(q => q.g === g).length;
    return {g, y, t:y + n, pct: y + n ? y / (y + n) : 1};
  }).filter(r => r.t).sort((a, b) => a.pct - b.pct || b.t - a.t);
  document.getElementById('bars').innerHTML = groups.map(r =>
    `<div class="hbar" title="${esc(r.g.name)}：答了 ${r.t} 题，做到 ${r.y} 项"><span class="nm">${esc(r.g.name)}</span>`
    + `<span class="tr"><span class="fl" style="display:block;width:${(r.pct * 100).toFixed(0)}%"></span></span>`
    + `<span class="v">${r.y} / ${r.t}</span></div>`).join('');

  const easy = no.filter(q => q.entry.will === '否'), free = easy.filter(q => q.entry.money === '0');
  const good = no.filter(q => q.entry.ratio !== '一般'), disp = no.filter(q => q.entry.dispute);
  const weak = groups.find(r => r.t >= 2 && r.pct < 1);
  let v = `你答了 ${answered} 题，做到 <b>${yes.length}</b> 项，没做到 <b>${no.length}</b> 项。`;
  if (answered > 0 && !no.length) v += '书里这些事你都做到了。';
  else if (!answered) v += '你还没有回答任何具体题目，返回答题后查看分析。';
  if (weak) v += `漏得最多的是「${esc(weak.g.name)}」，${weak.t} 项里做到 ${weak.y} 项。`;
  if (easy.length) v += `没做到的里有 <b>${easy.length}</b> 项一次办完就行，不用改习惯` + (free.length ? `，其中 ${free.length} 项不花钱。` : '。');
  if (disp.length) v += `有 ${disp.length} 项证据有争议，先看原条目的备注再决定。`;
  document.getElementById('verdict').innerHTML = v;

  document.getElementById('sum').innerHTML =
    `<div class="tile"><b>${answered ? Math.round(yes.length / answered * 100) : 0}%</b><span>答过的题里做到的比例</span></div>` +
    `<div class="tile"><b>${no.length}</b><span>还没做到</span></div>` +
    `<div class="tile r3"><b>${good.length}</b><span>其中性价比高或极高</span></div>` +
    `<div class="tile r2"><b>${easy.length}</b><span>其中一次办完就行</span></div>`;

  // 先做这三件：性价比最高的排前；同档里先挑不用改习惯的
  const top = no.slice(0, 3);
  const topTitle = `先做这${top.length === 3 ? '三' : top.length === 2 ? '两' : '一'}件`;
  const alsoOf = q => (q.also || []).map(a => find(a.sec, a.key)).filter(Boolean);
  let h = '';
  if (top.length) h += `<h2>${topTitle}<small>没做到的里性价比最高的</small></h2><ol class="top3">`
    + top.map(q => `<li><a href="#c-${q.entry.sec}-${q.entry.n}">${esc(plain(q.entry.title))}</a> <span class="why">性价比${q.entry.ratio}，证据 ${q.entry.grade} 级，${PILES.find(p => p.will === q.entry.will)?.name ?? ''}</span></li>`).join('') + '</ol>'
    + `<div class="copy-tools">
      <button class="btn" id="copy-actions" type="button">复制这几件事</button>
      <p class="copy-status" id="copy-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <div id="copy-fallback" hidden>
        <label for="copy-text">行动清单</label>
        <textarea id="copy-text" rows="10" readonly aria-describedby="copy-status"></textarea>
      </div>
    </div>`;
  for (const p of PILES){
    const list = no.filter(q => q.entry.will === p.will);
    if (!list.length) continue;
    h += `<h2>${p.name}（${list.length} 项）<small>${p.sub}</small></h2>` + list.map(q => card(q.entry, alsoOf(q))).join('');
  }
  document.getElementById('todo').innerHTML = h;
  if (top.length) document.getElementById('copy-text').value = `高性价比人生指南 · ${topTitle}\n\n` + top.map(({entry:e}) =>
    `- [ ] ${plain(e.title)}\n`
    + `  性价比${e.ratio}，证据 ${e.grade} 级，${PILES.find(p => p.will === e.will)?.name ?? ''}${e.dispute ? '，有争议（先看原条目的备注）' : ''}\n`
    + `  要花的：${plain(e.cost)}\n`
    + (e.note ? `  适用条件与注意事项：${plain(e.note)}\n` : '')
    + `  https://eternity4719.github.io/HowToLiveBetter/#e-${e.sec}-${e.n}`).join('\n\n');
  document.getElementById('done').innerHTML = yes.map(q =>
    `<li><a href="./#e-${q.entry.sec}-${q.entry.n}">${esc(plain(q.entry.title))}</a></li>`).join('');
  document.getElementById('done-h').hidden = !yes.length;
}

function show(which, focus = false){
  document.getElementById('ask').hidden = which !== 'ask';
  document.getElementById('out').hidden = which !== 'out';
  scrollTo(0, 0);
  if (focus) document.querySelector('#' + which + ' h1').focus({preventScroll: true});
}

document.getElementById('todo').addEventListener('click', async ev => {
  const b = ev.target.closest('#copy-actions'); if (!b) return;
  const status = document.getElementById('copy-status'), fallback = document.getElementById('copy-fallback');
  const text = document.getElementById('copy-text');
  b.disabled = true;
  fallback.hidden = true;
  status.textContent = '正在复制…';
  try {
    await navigator.clipboard.writeText(text.value);
    if (b.isConnected && !document.getElementById('out').hidden) status.textContent = '已复制，可以粘贴到备忘录或待办应用。';
  } catch (err) {
    // 等待剪贴板权限时可能已经返回改答案，不把焦点拉回旧结果。
    if (!b.isConnected || document.getElementById('out').hidden) return;
    fallback.hidden = false;
    status.textContent = '无法自动复制，请在下方手动复制清单。';
    text.focus();
    text.select();
    text.scrollTop = 0;
  } finally {
    b.disabled = false;
  }
});

document.getElementById('qs').addEventListener('click', ev => {
  const mb = ev.target.closest('button[data-mod]');
  if (mb) {
    const {mod} = mb.dataset;
    ans['mod:' + mod] = modOn(mod) ? 'off' : undefined;
    save(); renderAsk();
    document.querySelector(`button[data-mod="${CSS.escape(mod)}"]`)?.focus({preventScroll: true});
    return;
  }
  const b = ev.target.closest('button[data-k]'); if (!b) return;
  const {k, v} = b.dataset;
  ans[k] = ans[k] === v ? undefined : v;
  save(); renderAsk();
  document.querySelector(`button[data-k="${CSS.escape(k)}"][data-v="${CSS.escape(v)}"]`)?.focus({preventScroll: true});
});
document.getElementById('qs').addEventListener('input', ev => {
  if (!ev.target.matches('input[data-k="p:ageYears"]')) return;
  ans['p:ageYears'] = ev.target.value;
  // 保留年龄输入框和基本情况按钮，避免失焦重绘吞掉紧接着的点击。
  save(); renderAsk(false);
});
document.getElementById('go').addEventListener('click', () => {
  if (!profileDone()) { document.getElementById('prog').textContent = '请填完整基本情况，年龄填 0 到 120 的整数'; return; }
  renderOut(); show('out', true);
});
document.getElementById('back').addEventListener('click', () => show('ask', true));
document.getElementById('reset').addEventListener('click', () => { ans = {}; save(); renderAsk(); });

(async function init(){
  const status = document.getElementById('status');
  try {
    const EMBED = window.__CORPUS__;
    const readme = EMBED ? EMBED.readme : await (await fetch('README.md', {cache:'no-cache'})).text();
    const files = [...new Set(Array.from(readme.matchAll(/\]\((book\/[^)]+\.md)\)/g), m => m[1]))]
      .filter(f => GROUPS.some(g => g.qs.some(q => f.startsWith(`book/${String(q.sec).padStart(2,'0')}-`))));
    const parts = await Promise.all(files.map(async f => EMBED ? EMBED.parts[f] : (await fetch(f, {cache:'no-cache'})).text()));
    ENTRIES = parse(parts.join('\n\n'));
    for (const g of GROUPS) for (const q of g.qs) { q.g = g; q.entry = find(q.sec, q.key); }
    status.remove();
    renderAsk(); show('ask');
  } catch (err) {
    status.textContent = location.protocol === 'file:'
      ? '这个页面要通过 http 打开才能读取正文。'
      : `读取正文失败：${err.message}`;
  }
})();
</script>
